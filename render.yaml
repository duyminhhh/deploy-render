services:
  - type: web
    name: bhd-storage-backend
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bhd-storage-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: bhd-storage-frontend
          type: web
          property: host
          format: https://{value}

  - type: web
    name: bhd-storage-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: bhd-storage-backend
          type: web
          property: host
          format: https://{value}

databases:
  - name: bhd-storage-db
    region: singapore
    plan: free
    databaseName: bhd_storage
    user: bhd_user